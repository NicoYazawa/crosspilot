# CrossPilot 五容器本地部署
#
# 镜像版本全部选本地已有的，避免拉取。
# 敏感配置透传宿主机环境变量，缺失时直接报错（不落盘）。
#
# 启动: docker compose up -d --build
# 健康: curl http://localhost:8000/health
# 停止: docker compose down

name: crosspilot

services:
  postgres:
    image: postgres:18-alpine
    container_name: crosspilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crosspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-crosspilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crosspilot} -d ${POSTGRES_DB:-crosspilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.8.2-alpine
    container_name: crosspilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: crosspilot-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CGO_ENABLED: "0"
    image: crosspilot-app:latest
    container_name: crosspilot-app
    # 只绑回环：/observability/* 那一组没有鉴权（见 internal/presentation/http/
    # router.go 的挂载说明），发布到 0.0.0.0 就等于把它交给同网段的任何人。
    # 运维在本机仍可 curl localhost:8000/health 与 /observability/* 排障。
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      # HTTP 服务地址
      CROSSPILOT_HTTP_ADDR: ":8000"
      # Postgres（docker compose 服务名）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crosspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-crosspilot}
      POSTGRES_SSLMODE: disable
      # Redis
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Qdrant（config.go 硬编码 6334）
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      # LLM Provider
      #
      # 宿主侧（.env）用短名 QWEN_API_KEY，容器内必须是 config 认识的
      # LLM_ 前缀名——internal/config/config.go 的 provider() 读的是
      # LLM_QWEN_API_KEY。两套名字不一致时不会报错，只会「密钥读不到」，
      # 表现为接口回 503 model_unavailable，很难往命名上想。
      #
      # 这层映射不能省：environment: 是内联的，本文件没有 env_file，
      # .env 只参与 ${...} 替换，不会自动进容器。
      #
      # 也别写 ${A:-${B:-x}}：compose 的变量替换不支持嵌套默认值，
      # 会原样把整串当成字面量。
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-qwen}
      # Qwen
      LLM_QWEN_API_KEY: ${QWEN_API_KEY:-}
      LLM_QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_QWEN_MODEL: ${QWEN_MODEL:-qwen3-max}
      # MiniMax
      LLM_MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      LLM_MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      LLM_MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2}
      # DeepSeek
      LLM_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # Anthropic。Messages 协议族，适配器尚未实现：把它设为默认 provider
      # 时接口回 503，而不是拿一个必然 400 的请求去打它。
      LLM_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      LLM_ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # 可观测性（可选）
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: crosspilot-api
      # CORS（前端开发服务器）
      CROSSPILOT_HTTP_CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      # 商品引导文件。只被 crosspilot-catalog-import 读取（见 Dockerfile 的
      # ENTRYPOINT）；库非空时它自己会跳过，重启不会重复导入。
      CATALOG_BOOTSTRAP_PATH: /app/data/catalog-v3.jsonl.gz
      # JWT 密钥。留空 = 本地开发模式：router.go 会补一个固定的 demo 身份
      # （demo-buyer），链路照常跑通，前端也不需要令牌。
      #
      # 生产必须设：设了之后鉴权生效，此时前端必须能拿到令牌，否则界面全线 401。
      # 而当前前端只能靠构建期 VITE_AUTH_TOKEN 注入（等于把凭据打进 JS bundle，
      # 正是从 HMAC 换到 JWT 时否掉的做法），所以生产还缺一个运行时换令牌的
      # 身份服务——那之前不要把这个部署当生产用。
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crosspilot-frontend:latest
    container_name: crosspilot-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
