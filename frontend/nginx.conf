server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 三件套接口：明确 404（理由见文件末尾的长注释）。
    #
    # 必须显式返回，不能靠下面 location / 的 try_files 兜底：那样
    # GET /observability/runs/xxx/cost 会拿到 **200 + index.html**，
    # 调用方看到 200 会以为接口存在、只是响应解析不了，于是去查 JSON 解析、
    # 去查 Content-Type——而真正的事实是「这个端点在本部署中刻意不暴露」。
    # 用一个正确的状态码把「没有」说清楚。
    #
    # 用 ^~ 前缀：让匹配到此为止，不再落到 location / 的正则与 try_files。
    # 单独再写一条 location = /observability（无尾斜杠）覆盖裸路径。
    location ^~ /observability/ {
        return 404;
    }
    location = /observability {
        return 404;
    }

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 交易链路 + AG-UI 子应用。
    #
    # /commerce/ag-ui/ 比 /commerce/ 前缀更长，nginx 按最长前缀匹配，
    # 所以 SSE 的 streaming 配置会覆盖通用配置，不会被下面的通用块吃掉。
    location /commerce/ag-ui/ {
        proxy_pass http://app:8000;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 必需的 headers
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # 交易链路（订单 / 确认单）
    location /commerce/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # 刻意不代理 /observability/。
    #
    # 那不是「少配一条」：三件套接口返回的是 journal 原始事件，其中 run_start
    # 载荷带 buyer_id / session_id / query——别人的下单原话。而 run_id 是
    # run_<unixNanos>，可按时间戳穷举。接口自身没有鉴权（router.go 里这一组
    # 不挂身份链，理由是「鉴权由上游网关负责」）。
    #
    # 把它代理到浏览器可达的端口上，等于让上面那句理由不成立：任何能打开本页
    # 的人都能按时间戳猜 run_id，读回他人的会话与查询。所以默认不暴露，
    # 由运维经内网或带鉴权的网关自行访问（app 端口也只绑回环，见 compose）。
    #
    # 代价：交付界面里的 Replay / Cost / Diff 面板在容器部署下拿不到数据。
    # 要让它们可用，得先给这组接口真正的鉴权（或让前端携带令牌），
    # 而不是靠「不代理」来兜底。
}
